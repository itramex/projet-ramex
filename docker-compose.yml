version: '3.8'

services:
  # PostgreSQL Database avec PostGIS
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: vanille_db
    environment:
      POSTGRES_DB: vanille_db
      POSTGRES_USER: vanille_user
      POSTGRES_PASSWORD: vanille_pass_2025
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vanille_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanille_user -d vanille_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vanille_backend
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-change-this-in-production-$(openssl rand -hex 32)"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      
      # Database
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: vanille_db
      DB_USER: vanille_user
      DB_PASSWORD: vanille_pass_2025
      DB_HOST: db
      DB_PORT: 5432
      
      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
      
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vanille_network
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --reload backend.wsgi:application

  # Frontend React/Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vanille_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vanille_network
    environment:
      VITE_API_URL: http://localhost:8000/api

  # Ollama pour l'IA (optionnel - décommenter si nécessaire)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: vanille_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - vanille_network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  postgres_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  # ollama_data:
  #   driver: local

networks:
  vanille_network:
    driver: bridge
